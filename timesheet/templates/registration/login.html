{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CodeClock</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-6 bg-slate-50 antialiased">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-blue-50 rounded-2xl mb-4 border border-blue-100 shadow-xs">
                <img src="{% static 'img/timesheet-icon.png' %}" alt="CodeClock" class="h-10 w-10 object-contain">
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">
                Welcome Back
            </h1>
            <p class="text-slate-500 text-sm">Sign in to manage your time, tasks, and projects</p>
        </div>

        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/50">
            <form method="post">
                {% csrf_token %}
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                        <input type="text" name="username" required placeholder="Enter username" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>

                        <div class="relative">
                            <input 
                                type="password" 
                                name="password" 
                                id="password"
                                required
                                placeholder="••••••••"
                                class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 pr-12 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400 text-sm"
                            >

                            <span onclick="togglePassword()" 
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 cursor-pointer p-1">
                                <i id="toggleIcon" class="fa fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md shadow-blue-500/10 transition-all hover:shadow-lg">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center pt-4 border-t border-slate-100">
                <p class="text-slate-500 text-sm">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-700 font-semibold">Sign Up</a>
                </p>
            </div>
        </div>

        <p class="text-center mt-8 text-slate-400 text-xs">
            &copy; 2026 CodeClock. All rights reserved.
        </p>
    </div>
    <script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.getElementById("toggleIcon");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>
</body>
</html>
