{% load crispy_forms_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Timesheet Pro</title>

    <!-- Local CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1 class="title">Timesheet Pro</h1>
        <p class="subtitle">Sign in to manage your time and projects</p>
    </div>

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input type="password" name="password" id="password" required>

                    <span onclick="togglePassword()" class="toggle-icon">
                        <i id="toggleIcon" class="fa fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit">Sign In</button>
        </form>

        <div class="signup-text">
            <p>
                Don't have an account?
                <a href="{% url 'register' %}">Sign Up</a>
            </p>
        </div>
    </div>

    <p class="footer">
        &copy; 2025 Timesheet Pro. All rights reserved.
    </p>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.getElementById("toggleIcon");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
