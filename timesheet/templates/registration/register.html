{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CodeClock</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        input, select, textarea {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
            border-radius: 0.75rem !important;
        }
        label { color: #334155 !important; font-size: 0.875rem !important; margin-bottom: 0.25rem !important; font-weight: 500 !important; }
        .text-danger { color: #dc2626 !important; font-size: 0.75rem !important; margin-top: 0.25rem !important; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-6 bg-slate-50 antialiased">
    <div class="max-w-md w-full my-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-blue-50 rounded-2xl mb-4 border border-blue-100 shadow-xs">
                <img src="{% static 'img/timesheet-icon.png' %}" alt="CodeClock" class="h-10 w-10 object-contain">
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">
                Create Account
            </h1>
            <p class="text-slate-500 text-sm">Add a new employee to the CodeClock workspace</p>
        </div>

        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/50">
            <form method="post">
                {% csrf_token %}
                <div class="space-y-4">
                    {{ form|crispy }}

                    <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md shadow-blue-500/10 transition-all hover:shadow-lg mt-4">
                        Register
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center pt-4 border-t border-slate-100">
                <p class="text-slate-500 text-sm">
                    Already have an account?
                    <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-700 font-semibold">Sign In</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
