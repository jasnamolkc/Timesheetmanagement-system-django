{% load crispy_forms_tags %}
<div class="flex items-center justify-between mb-8">
    <h2 class="text-3xl font-bold text-white tracking-tight flex items-center gap-3">
        <i class="fas fa-edit text-blue-400"></i> {{ view.get_form_title|default:"Form Entry" }}
    </h2>
    <button type="button" onclick="closeModal()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-900 text-slate-400 hover:text-white hover:bg-red-500/20 hover:border-red-500/50 border border-slate-700/50 transition-all">
        <i class="fas fa-times text-lg"></i>
    </button>
</div>

<form method="post" action="{{ request.path }}" enctype="multipart/form-data" class="space-y-6">
    {% csrf_token %}

    <div class="modal-form-body grid grid-cols-1 gap-4">
        {% crispy form %}
    </div>

    <!-- Custom Task Add Button in Timesheet Form -->
    {% if "timesheet" in request.path %}
    <div class="mt-2 text-right">
        <button type="button" id="addTaskBtn" disabled class="text-blue-400 hover:text-blue-300 text-xs font-bold flex items-center gap-2 ml-auto bg-blue-500/5 px-3 py-1.5 rounded-lg border border-blue-500/10 hover:border-blue-500/30 transition-all">
            <i class="fas fa-plus-circle"></i> Create New Task for this Project
        </button>
    </div>
    {% endif %}

    <div class="flex items-center gap-4 pt-6 mt-6 border-t border-slate-700/50">
        <button type="button" onclick="closeModal()" class="flex-1 btn !bg-slate-700/50 hover:!bg-slate-700 border border-slate-600/30 text-slate-400 hover:text-white transition-all font-bold">
            Cancel
        </button>
        <button type="submit" class="flex-1 btn btn-primary font-bold shadow-lg shadow-blue-500/20">
            <i class="fas fa-save"></i> Save Changes
        </button>
    </div>
</form>

<style>
/* Refined form appearance within modals */
#modal-content .form-group { margin-bottom: 20px; }
#modal-content .asteriskField { color: #f87171; }
#modal-content .invalid-feedback { font-size: 11px; font-weight: 600; color: #f87171; margin-top: 4px; }
#modal-content .help-block { font-size: 11px; color: #64748b; margin-top: 4px; }
</style>
