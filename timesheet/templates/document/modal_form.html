{% load crispy_forms_tags %}

<div class="mb-4 flex items-center justify-between pb-3 border-b border-slate-100">
    <h3 class="text-lg font-bold text-slate-900">
        {% if form.instance.pk %}Edit Document{% else %}Upload Document{% endif %}
    </h3>
    <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">✕</button>
</div>

<form method="POST" enctype="multipart/form-data" action="{{ request.path }}">
    {% csrf_token %}

    <div class="space-y-4">

        <div class="form-group">
            {{ form.name.label_tag }}
            {{ form.name }}
        </div>

        <div class="form-group">
            {{ form.file.label_tag }}
            {{ form.file }}
        </div>

    </div>

    <div class="mt-6 flex justify-end space-x-3 pt-3 border-t border-slate-100">

        <button type="button"
                onclick="closeModal()"
                class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors">
            Cancel
        </button>

        <button type="submit"
                class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-xs">
            Save Document
        </button>

    </div>

</form>
<style>
input, select, textarea {
    background-color: #ffffff !important;
    border: 1px solid #cbd5e1 !important;
    color: #0f172a !important;
    border-radius: 0.5rem !important;
    padding: 0.5rem 0.75rem !important;
}

label {
    color: #334155 !important;
    font-size: 0.875rem !important;
    font-weight: 500 !important;
}

.text-danger {
    color: #dc2626 !important;
    font-size: 0.75rem !important;
}
</style>
