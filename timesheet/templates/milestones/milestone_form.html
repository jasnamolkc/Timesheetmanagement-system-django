{% load crispy_forms_tags %}

<div class="mb-4">
    <h3 class="text-xl font-bold text-white">
        {% if form.instance.pk %}Edit Milestone{% else %}Create Milestone{% endif %}
    </h3>
</div>

<form method="post" action="{{ request.path }}">
    {% csrf_token %}

    <div class="space-y-4">
        {{ form|crispy }}
    </div>

    <div class="mt-6 flex justify-end space-x-3">

        <button type="button"
                onclick="closeModal()"
                class="px-5 py-2 bg-slate-700 text-white rounded-lg">
            Cancel
        </button>

        <button type="submit"
                class="px-5 py-2 bg-blue-600 text-white rounded-lg">
            Save
        </button>

    </div>

</form>
