<div class="p-6">
    <h2 class="text-xl font-bold mb-4">Create Task</h2>

    <form method="POST" action="{% url 'task_create' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <!-- Title -->
            <div>
                <label class="text-sm text-slate-400">Title</label>
                <input type="text" name="title" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
            </div>

            <!-- Project -->
            <div>
                <label class="text-sm text-slate-400">Project</label>
                <select name="project" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                    {% for project in projects %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Assigned To -->
            <div>
                <label class="text-sm text-slate-400">Assigned To</label>
                <select name="assigned_to"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                    <option value="">Unassigned</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">
                        {{ emp.user.get_full_name|default:emp.user.username }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Milestone -->
            <div>
                <label class="text-sm text-slate-400">Milestone</label>
                <select name="milestone"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                    <option value="">No Milestone</option>
                    {% for milestone in milestones %}
                    <option value="{{ milestone.id }}">
                        {{ milestone.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Status -->
            <div>
                <label class="text-sm text-slate-400">Status</label>
                <select name="status"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                    <option value="PENDING">Pending</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="COMPLETED">Completed</option>
                </select>
            </div>

            <!-- Due Date -->
            <div>
                <label class="text-sm text-slate-400">Due Date</label>
                <input type="date" name="due_date"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
            </div>

            <!-- Estimated Hours -->
            <div>
                <label class="text-sm text-slate-400">Estimated Hours</label>
                <input type="number" step="0.01" name="estimated_hours"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
            </div>

        </div>

        <!-- Description Full Width -->
        <div class="mt-4">
            <label class="text-sm text-slate-400">Description</label>
            <textarea name="description" rows="3"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"></textarea>
        </div>

        <button type="submit"
            class="mt-5 w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
            Save Task
        </button>

    </form>
</div>
