{% load crispy_forms_tags %}

<div class="mb-4">
    <h3 class="text-xl font-bold text-white">
        {% if form.instance.pk %}Edit Task{% else %}Create Task{% endif %}
    </h3>
</div>

<form method="post" action="{{ request.path }}">
    {% csrf_token %}

    <div class="space-y-4">
        {{ form|crispy }}
    </div>

    <div class="mt-6 flex justify-end space-x-3">
        <button type="button"
                onclick="closeModal()"
                class="px-5 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-600">
            Cancel
        </button>

        <button type="submit"
                class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            Save
        </button>
    </div>
</form>
<script>

const projectField = document.getElementById("id_project");
const milestoneField = document.getElementById("id_milestone");

if (projectField && milestoneField) {

    projectField.addEventListener("change", function(){

        let projectId = this.value;

        if(!projectId){
            milestoneField.innerHTML = '<option value="">No Milestone</option>';
            return;
        }

        fetch("/milestones-by-project/" + projectId + "/")
        .then(res => res.json())
        .then(data => {

            milestoneField.innerHTML = '<option value="">No Milestone</option>';

            data.milestones.forEach(m => {
                milestoneField.innerHTML +=
                    `<option value="${m.id}">${m.name}</option>`;
            });

        });

    });

}

</script>
<style>
input, select, textarea {
    background-color: #0f172a !important;
    border: 1px solid #334155 !important;
    color: #f8fafc !important;
    border-radius: 0.5rem !important;
}

label {
    color: #94a3b8 !important;
    font-size: 0.875rem !important;
}

.text-danger {
    color: #f87171 !important;
}
</style>
