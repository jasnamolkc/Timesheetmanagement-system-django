{% load crispy_forms_tags %}

<div class="mb-4">
    <h3 class="text-xl font-bold text-white">
        {% if form.instance.pk %}Edit Task{% else %}Create Task{% endif %}
    </h3>
</div>

<form method="post" action="{{ request.path }}" enctype="multipart/form-data" >
    {% csrf_token %}

    <div class="space-y-4">
        {{ form|crispy }}
        <!-- Multiple Image Upload -->
       {% if form.instance.pk and form.instance.images.all %}
<div class="mt-4">
    <label class="text-sm text-slate-400 mb-2 block">
        Existing Images
    </label>

    <div class="grid grid-cols-3 gap-3">

        {% for img in form.instance.images.all %}
        <div id="task-image-{{ img.id }}" class="relative group">

    <img src="{{ img.image.url }}"
         class="w-full h-24 object-cover rounded-lg border border-slate-700">

    <button
        type="button"
        onclick="deleteTaskImage({{ img.id }})"
        class="absolute top-1 right-1 bg-red-600 text-white text-xs px-2 py-1 rounded">
        ✕
    </button>

</div>
        {% endfor %}

    </div>
</div>
{% endif %}
    <div class="mt-4">

<label class="text-sm text-slate-400 mb-2 block">
Upload Images
</label>

<input
    type="file"
    name="images"
    id="task-images"
    multiple
    accept="image/*"
    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"
/>

<!-- Preview container -->
<div id="image-preview" class="grid grid-cols-3 gap-3 mt-3"></div>

</div>
    </div>

    <div class="mt-6 flex justify-end space-x-3">
        <button type="button"
                onclick="closeModal()"
                class="px-5 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-600">
            Cancel
        </button>

        <button type="submit"
                class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            Save
        </button>
    </div>
</form>

<style>
input, select, textarea {
    background-color: #0f172a !important;
    border: 1px solid #334155 !important;
    color: #f8fafc !important;
    border-radius: 0.5rem !important;
}

label {
    color: #94a3b8 !important;
    font-size: 0.875rem !important;
}

.text-danger {
    color: #f87171 !important;
}
</style>
