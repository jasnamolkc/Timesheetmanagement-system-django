{% load crispy_forms_tags %}

<div class="mb-4 flex items-center justify-between pb-3 border-b border-slate-100">
    <h3 class="text-lg font-bold text-slate-900">
        {% if form.instance.pk %}Edit Task{% else %}Create Task{% endif %}
    </h3>
    <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">✕</button>
</div>

<form method="post" action="{{ request.path }}" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="space-y-4">
        {{ form|crispy }}
        
        <!-- Multiple Image Upload -->
        {% if form.instance.pk and form.instance.images.all %}
        <div class="mt-4">
            <label class="text-sm font-medium text-slate-700 mb-2 block">
                Existing Images
            </label>

            <div class="grid grid-cols-3 gap-3">
                {% for img in form.instance.images.all %}
                <div id="task-image-{{ img.id }}" class="relative group">
                    <img src="{{ img.image.url }}"
                         class="w-full h-24 object-cover rounded-xl border border-slate-200 shadow-xs">

                    <button
                        type="button"
                        onclick="deleteTaskImage({{ img.id }})"
                        class="absolute top-1 right-1 bg-red-600 text-white text-xs px-2 py-0.5 rounded-lg shadow-xs hover:bg-red-700">
                        ✕
                    </button>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <div class="mt-4">
            <label class="text-sm font-medium text-slate-700 mb-2 block">
                Upload Images
            </label>

            <input
                type="file"
                name="images"
                id="task-images"
                multiple
                accept="image/*"
                class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm text-slate-800"
            />

            <!-- Preview container -->
            <div id="image-preview" class="grid grid-cols-3 gap-3 mt-3"></div>
        </div>
    </div>

    <div class="mt-6 flex justify-end space-x-3 pt-3 border-t border-slate-100">
        <button type="button"
                onclick="closeModal()"
                class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors">
            Cancel
        </button>

        <button type="submit"
                class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-xs">
            Save Task
        </button>
    </div>
</form>

<style>
input, select, textarea {
    background-color: #ffffff !important;
    border: 1px solid #cbd5e1 !important;
    color: #0f172a !important;
    border-radius: 0.5rem !important;
}

label {
    color: #334155 !important;
    font-size: 0.875rem !important;
    font-weight: 500 !important;
}

.text-danger {
    color: #dc2626 !important;
}
</style>
