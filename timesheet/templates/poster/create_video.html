{% extends "base.html" %}
{% block title %}Create Video Poster{% endblock %}

{% block content %}

<div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xs max-w-xl mx-auto">

    <div class="mb-6">
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Video Poster</h2>
        <p class="text-slate-500 text-sm mt-1">Upload video asset and configuration parameters</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="mt-6 flex justify-end space-x-3 pt-3 border-t border-slate-100">
            <a href="{% url 'poster_list' %}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors">
                Cancel
            </a>
            <button type="submit"
                class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm shadow-xs transition-colors">
                Generate Video Poster
            </button>
        </div>
    </form>

</div>

{% endblock %}
