{% extends "base.html" %}
{% block title %}Poster Preview{% endblock %}

{% block content %}

<div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold text-white">
            Generated Posters
        </h2>

        <!-- Download All -->
        <a href="{% url 'download_all' poster.id %}"
           class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm">
            <i class="fas fa-download mr-2"></i> Download All
        </a>
    </div>

    <!-- Posters Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Instagram -->
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
            <h3 class="text-sm font-medium mb-3 text-blue-400">Instagram</h3>

            <img src="{{ poster.instagram_image.url }}"
                 class="w-full h-64 object-cover rounded-lg border border-slate-700">

            <a href="{{ poster.instagram_image.url }}" download="instagram.jpg"
               class="mt-3 block text-center bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm">
                Download
            </a>
        </div>

        <!-- WhatsApp -->
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
            <h3 class="text-sm font-medium mb-3 text-green-400">WhatsApp</h3>

            <img src="{{ poster.whatsapp_image.url }}"
                 class="w-full h-64 object-cover rounded-lg border border-slate-700">

            <a href="{{ poster.whatsapp_image.url }}" download="whatsapp.jpg"
               class="mt-3 block text-center bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-sm">
                Download
            </a>
        </div>

        <!-- Facebook -->
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
            <h3 class="text-sm font-medium mb-3 text-indigo-400">Facebook</h3>

            <img src="{{ poster.facebook_image.url }}"
                 class="w-full h-64 object-cover rounded-lg border border-slate-700">

            <a href="{{ poster.facebook_image.url }}" download="facebook.jpg"
               class="mt-3 block text-center bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm">
                Download
            </a>
            <a href="https://wa.me/?text={{ poster.whatsapp_image.url }}" target="_blank">
                Share on WhatsApp
            </a>
        </div>

    </div>

</div>

{% endblock %}
