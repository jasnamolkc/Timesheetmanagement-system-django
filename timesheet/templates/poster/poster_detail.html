{% extends "base.html" %}
{% block title %}Poster Preview{% endblock %}

{% block content %}

<div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-xs">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <div class="flex items-center gap-3">
            <a href="{% url 'poster_list' %}"
               class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold px-3 py-1.5 rounded-xl text-xs shadow-xs transition-colors inline-flex items-center gap-1.5">
                <i class="fas fa-arrow-left text-slate-400"></i> Back
            </a>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">
                Generated Image Posters
            </h2>
        </div>

        <!-- Download All -->
        <a href="{% url 'download_all' poster.id %}"
           class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm shadow-xs transition-colors flex items-center">
            <i class="fas fa-download mr-2"></i> Download All
        </a>
    </div>

    <!-- Posters Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Instagram -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-blue-600">Instagram</h3>
                <span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-semibold">1080x1080</span>
            </div>

            <img src="{{ poster.instagram_image.url }}"
                 class="w-full h-64 object-cover rounded-xl border border-slate-200 shadow-xs">

            <a href="{{ poster.instagram_image.url }}" download="instagram.jpg"
               class="mt-3 block text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-xl text-xs transition-colors shadow-xs">
                <i class="fas fa-download mr-1"></i> Download Instagram
            </a>
        </div>

        <!-- WhatsApp -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-600">WhatsApp</h3>
                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">Story / Status</span>
            </div>

            <img src="{{ poster.whatsapp_image.url }}"
                 class="w-full h-64 object-cover rounded-xl border border-slate-200 shadow-xs">

            <a href="{{ poster.whatsapp_image.url }}" download="whatsapp.jpg"
               class="mt-3 block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-xl text-xs transition-colors shadow-xs">
                <i class="fas fa-download mr-1"></i> Download WhatsApp
            </a>
        </div>

        <!-- Facebook -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-600">Facebook</h3>
                <span class="text-[10px] bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-semibold">Landscape Feed</span>
            </div>

            <img src="{{ poster.facebook_image.url }}"
                 class="w-full h-64 object-cover rounded-xl border border-slate-200 shadow-xs">

            <a href="{{ poster.facebook_image.url }}" download="facebook.jpg"
               class="mt-3 block text-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-xl text-xs transition-colors shadow-xs">
                <i class="fas fa-download mr-1"></i> Download Facebook
            </a>
            <a href="https://wa.me/?text={{ poster.whatsapp_image.url }}" target="_blank"
               class="block text-center mt-2 text-xs text-emerald-600 font-semibold hover:underline">
                <i class="fab fa-whatsapp mr-1"></i> Share on WhatsApp
            </a>
        </div>

    </div>

</div>

{% endblock %}
