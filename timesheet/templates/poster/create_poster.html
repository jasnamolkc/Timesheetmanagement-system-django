{% extends "base.html" %}
{% block content %}

<div class="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-lg">

    <h2 class="text-lg font-semibold mb-4">Create Poster</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-4">
                <label class="block text-sm mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-400 text-xs">{{ field.errors }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-white">
            Generate Poster
        </button>
    </form>

</div>

{% endblock %}
